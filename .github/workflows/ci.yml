name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: template/package-lock.json

      # The tsc hook type-checks template/ against its installed dependencies.
      - name: Install template dependencies
        run: npm ci
        working-directory: template

      - uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: pip install pre-commit==4.6.2

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

  commit-messages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check commit messages
        run: pipx run --spec commitizen==4.19.2 cz check --rev-range HEAD
