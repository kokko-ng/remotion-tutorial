<svg class="figure-dark" viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg">

<g id="sample-boundary">
<title>System</title>
<rect x="40" y="40" width="760" height="420" rx="8" fill="rgba(214,222,235,0.04)" stroke="rgba(214,222,235,0.42)" stroke-width="1.40"/>
<text x="60" y="62" fill="#9aa8ba" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">SAMPLE SYSTEM · BOUNDARY</text>
<g id="sample-api">
<title>API</title>
<rect x="80" y="100" width="220" height="110" rx="6" fill="#101418" stroke="#d6deeb" stroke-width="1.60"/>
<text x="92" y="116" fill="#9aa8ba" font-size="8" font-family="'IBM Plex Mono', monospace">CONTAINER</text>
<text x="190" y="150" fill="#d6deeb" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">API</text>
<text x="190" y="168" fill="#9aa8ba" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">[Container: Python]</text>
</g>
<g id="sample-worker">
<title>Worker</title>
<rect x="480" y="100" width="220" height="110" rx="6" fill="#101418" stroke="#d6deeb" stroke-width="1.60"/>
<text x="492" y="116" fill="#9aa8ba" font-size="8" font-family="'IBM Plex Mono', monospace">CONTAINER</text>
<text x="590" y="150" fill="#d6deeb" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Worker</text>
<text x="590" y="168" fill="#9aa8ba" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">[Container: Python]</text>
</g>
<g id="sample-store">
<title>Store</title>
<rect x="280" y="300" width="240" height="110" rx="6" fill="#F5F5F5" stroke="#d6deeb" stroke-width="1.60"/>
<text x="292" y="316" fill="#9aa8ba" font-size="8" font-family="'IBM Plex Mono', monospace">DATA STORE</text>
<text x="400" y="350" fill="#d6deeb" font-size="12" font-weight="600" font-family="'IBM Plex Sans', sans-serif" text-anchor="middle">Store</text>
<text x="400" y="368" fill="#9aa8ba" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">[Container: Redis]</text>
</g>
</g>
<line x1="300" y1="155" x2="478" y2="155" stroke="#9aa8ba" stroke-width="1.92"/>
<text x="389" y="146" fill="#9aa8ba" font-size="9" font-family="'IBM Plex Mono', monospace" text-anchor="middle">QUEUES WORK</text>
<line x1="590" y1="210" x2="470" y2="298" stroke="#d16d9e" stroke-width="1.92"/>
<text x="600" y="262" fill="#9aa8ba" font-size="9" font-family="'IBM Plex Mono', monospace">WRITES STATE</text>
<text x="40" y="500" fill="#9aa8ba" font-size="8" font-family="'IBM Plex Mono', monospace" letter-spacing="0.14em">LEGEND · BOX = CONTAINER · GREY BOX = DATA STORE</text>
</svg>
