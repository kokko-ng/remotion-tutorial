default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      # Largest committed sample still is ~190 KB; 500 KB leaves headroom
      # for a new preset sample while still blocking renders and audio.
      - id: check-added-large-files
        args: [--maxkb=500]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      # Needs `npm ci` in template/ first; fails rather than skipping when
      # the dependencies are missing.
      - id: tsc
        name: tsc --noEmit (template)
        language: system
        entry: sh -c 'cd template && if [ ! -x node_modules/.bin/tsc ]; then echo "template/node_modules missing, run npm ci in template/" >&2; exit 1; fi; exec node_modules/.bin/tsc --noEmit -p .'
        files: ^template/(.*\.(ts|tsx)|tsconfig\.json|package(-lock)?\.json)$
        pass_filenames: false

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.2
    hooks:
      - id: commitizen
        stages: [commit-msg]
